name: "Azure DevOps PR Review"
repo: "https://github.com/WTLAIB/opencode-azure-devops-pr-review-v2"
tagline: "OpenCode V2: review Azure DevOps PRs from a URL without checkout, with separate verification and comment previews"
description: "Review Azure DevOps Services pull requests from a URL without a local checkout. Choose OpenCode models per role, use separate sessions to verify findings in review and deep modes, and preview inline comments before publishing. Quick mode skips separate verification. Supports a forward proxy and custom CA certificates for Azure DevOps requests. Tested with OpenCode CLI 2.1.4 using the V2 plugin API; OpenCode 1.x and Azure DevOps Server are not supported. Install with: opencode plugin add opencode-azure-devops-pr-review"
tags: ["azure-devops", "code-review", "opencode-v2"]
