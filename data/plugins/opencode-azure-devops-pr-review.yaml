description: "Review Azure DevOps Services pull requests from a URL without a local checkout. Choose OpenCode models per role, use separate sessions to verify findings in review and deep modes, and preview inline comments before publishing. Quick mode skips separate verification. Supports an Azure forward proxy and custom CA certificates. Tested with OpenCode CLI 2.1.4 using the V2 plugin API; OpenCode 1.x and Azure DevOps Server are not supported."
